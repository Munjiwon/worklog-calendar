<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 - 근무일지 캘린더</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell admin-shell">
    <section class="toolbar" aria-label="관리자 메뉴">
      <div>
        <p class="eyebrow">Work Log Calendar</p>
        <h1>관리자</h1>
      </div>
      <div class="toolbar-account">
        <p id="accountGreeting" class="account-greeting" aria-live="polite" hidden>안녕하세요, <strong id="accountName"></strong>님</p>
        <div class="toolbar-actions">
          <a class="secondary link-button" href="/">캘린더</a>
          <form method="post" action="/logout" class="logout-form">
            <button type="submit" class="secondary">로그아웃</button>
          </form>
        </div>
      </div>
    </section>

    <section class="admin-grid">
      <form id="semesterForm" class="summary-panel admin-card semester-card">
        <div class="panel-header">
          <div>
            <h2>학기 관리</h2>
            <p class="admin-card-description">학교 공통 학기를 여러 개 등록하고 기간을 관리합니다.</p>
          </div>
        </div>
        <p id="semesterFormMessage" class="form-message hidden" aria-live="polite"></p>
        <input id="semesterId" type="hidden">
        <label>
          학기명
          <input id="semesterName" type="text" maxlength="80" placeholder="예: 2026학년도 2학기" required>
        </label>
        <div class="modal-row">
          <label>
            시작일
            <input id="semesterStartDate" type="date" required>
          </label>
          <label>
            종료일
            <input id="semesterEndDate" type="date" required>
          </label>
        </div>
        <div class="semester-form-actions">
          <button id="cancelSemesterEdit" type="button" class="secondary hidden">수정 취소</button>
          <button id="semesterSubmit" type="submit">학기 추가</button>
        </div>
        <button id="semesterListToggle" type="button" class="semester-list-toggle secondary" aria-expanded="false" aria-controls="semesterList">학기 목록 펼치기</button>
        <div id="semesterList" class="semester-list hidden"></div>
      </form>

      <section class="summary-panel admin-card course-catalog-card" aria-label="수업 데이터 관리">
        <div class="panel-header">
          <div>
            <h2>수업 데이터 관리</h2>
            <p class="admin-card-description">학기별 전공 수업 엑셀을 올리면 공통 수업 목록을 갱신합니다.</p>
          </div>
        </div>
        <p id="courseImportMessage" class="form-message hidden" aria-live="polite"></p>
        <form id="courseImportForm" class="course-import-form">
          <label>
            적용 학기
            <select id="courseImportSemester" required></select>
          </label>
          <label>
            수업시간표 엑셀
            <input id="courseImportFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
          </label>
          <button id="courseImportSubmit" type="submit">수업 목록 등록</button>
        </form>
        <p class="course-import-help">필수 열: 학과, 교과, 과목-분반, 과목명, 교수, 개설시간 및 강의실</p>
        <button id="courseCatalogToggle" type="button" class="semester-list-toggle secondary" aria-expanded="false" aria-controls="courseCatalogList">등록 수업 0개 펼치기</button>
        <div id="courseCatalogList" class="course-catalog-list hidden"></div>
      </section>

      <form id="userForm" class="summary-panel admin-card">
        <div class="panel-header">
          <h2>계정 만들기</h2>
        </div>
        <p id="userFormMessage" class="login-error hidden"></p>
        <label>
          아이디
          <input id="newUsername" type="text" autocomplete="off" required>
        </label>
        <label>
          비밀번호
          <input id="newPassword" type="password" autocomplete="new-password" required>
        </label>
        <label>
          이름
          <input id="newName" type="text" autocomplete="off" required>
        </label>
        <label>
          이메일
          <input id="newEmail" type="email" autocomplete="off" required>
        </label>
        <label>
          권한
          <select id="newRole">
            <option value="user">일반</option>
            <option value="admin">관리자</option>
          </select>
        </label>
        <button type="submit">계정 만들기</button>
      </form>

      <section class="summary-panel admin-card user-list-card" aria-label="계정 목록">
        <div class="panel-header">
          <h2>계정 목록</h2>
        </div>
        <div id="userList" class="user-list"></div>
      </section>
    </section>
  </main>

  <div id="editUserModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editUserModalTitle">
    <form id="editUserForm" class="modal-card">
      <div class="modal-header">
        <h2 id="editUserModalTitle">회원 수정</h2>
        <button id="closeEditUserModal" type="button" class="icon-button" aria-label="회원 수정 닫기">×</button>
      </div>
      <p id="editUserFormMessage" class="login-error hidden"></p>
      <input id="editUsername" type="hidden">
      <label>
        아이디
        <input id="editUsernameDisplay" type="text" disabled>
      </label>
      <label>
        새 비밀번호
        <input id="editPassword" type="password" autocomplete="new-password" placeholder="변경하지 않으려면 비워두세요">
      </label>
      <label>
        이름
        <input id="editName" type="text" autocomplete="off" required>
      </label>
      <label>
        이메일
        <input id="editEmail" type="email" autocomplete="off" required>
      </label>
      <label>
        권한
        <select id="editRole">
          <option value="user">일반</option>
          <option value="admin">관리자</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="secondary" data-edit-user-cancel>취소</button>
        <button type="submit">저장</button>
      </div>
    </form>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
